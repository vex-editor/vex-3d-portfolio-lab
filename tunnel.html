<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX Lab — النفق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#06070F; --fg:#F2F1FA; --muted:#8E8CA8; --purple:#8B3DFF; --purple-bright:#B07CFF; --border:rgba(139,61,255,.18); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:auto; }
  body { background:var(--bg); color:var(--fg); font-family:'Readex Pro',sans-serif; }
  #scroll-space { height:600vh; }
  canvas#tunnel { position:fixed; inset:0; width:100vw; height:100vh; display:block; }

  .lab-nav { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:18px 28px; }
  .logo { font-weight:900; font-size:1.3rem; letter-spacing:.5px; color:var(--fg); text-decoration:none; }
  .logo span { color:var(--purple-bright); }
  .lab-nav nav { display:flex; gap:10px; }
  .lab-nav nav a {
    color:var(--muted); text-decoration:none; font-size:.85rem; border:1px solid var(--border);
    padding:7px 14px; border-radius:999px; backdrop-filter:blur(8px); background:rgba(6,7,15,.4); transition:.25s;
  }
  .lab-nav nav a:hover { color:var(--fg); border-color:var(--purple); background:rgba(139,61,255,.12); }

  .overlay { position:fixed; inset:0; z-index:5; pointer-events:none; }
  .scene-cap {
    position:absolute; bottom:9vh; left:0; right:0; text-align:center; transition:opacity .4s;
  }
  .scene-cap h2 { font-size:clamp(1.6rem,4.5vw,3.2rem); font-weight:900; text-shadow:0 4px 30px rgba(6,7,15,.9); }
  .scene-cap p { color:var(--muted); font-size:.9rem; margin-top:8px; }
  .hint {
    position:absolute; bottom:3vh; left:50%; transform:translateX(-50%);
    font-size:.78rem; color:var(--muted); border:1px solid var(--border); border-radius:999px;
    padding:8px 18px; backdrop-filter:blur(8px); background:rgba(6,7,15,.4); white-space:nowrap;
  }
  .hint b { color:var(--purple-bright); font-weight:600; }
</style>
</head>
<body>

<header class="lab-nav">
  <a class="logo" href="./">VEX<span>.</span></a>
  <nav>
    <a href="particles.html">التفاعل</a>
    <a href="scenes.html">مشاهد 3D</a>
    <a href="./">الموقع الرئيسي ←</a>
  </nav>
</header>

<div id="scroll-space"></div>
<canvas id="tunnel"></canvas>

<div class="overlay">
  <div class="scene-cap" id="cap0">
    <h2>اتفرج على الشغل جوّه النفق</h2>
    <p>اسكرول — الكاميرا بتمشي بين البانلز</p>
  </div>
  <div class="scene-cap" id="cap1" style="opacity:0">
    <h2>كل بانل شغل حقيقي</h2>
    <p>زجاج + ضباب بنفسجي + فيديو حي</p>
  </div>
  <div class="scene-cap" id="cap2" style="opacity:0">
    <h2>VEX<span style="color:var(--purple-bright)">.</span></h2>
    <p>وصلت الآخر — كده الشغل بيتشاف</p>
  </div>
  <div class="hint">اسكرول تحت — <b>الكاميرا بتتحرك معاك</b></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const VIDEOS = [
  "1-vxw5.mp4", "5-vxw1.mp4", "6-vxw2.mp4", "7-vxw3.mp4",
  "1-vex-motion.mp4", "1-coffee-before-after.mp4", "1-vex-stand-out.mp4", "8-vxw4.mp4"
];

const canvas = document.getElementById('tunnel');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06070f);
scene.fog = new THREE.FogExp2(0x0b0618, 0.055);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0, 0, 8);

/* lights */
scene.add(new THREE.AmbientLight(0x8b3dff, 0.55));
const key = new THREE.PointLight(0xb07cff, 60, 40); key.position.set(0, 3, 0); scene.add(key);
const fill = new THREE.PointLight(0x3a1a80, 40, 50); fill.position.set(0, -2, -10); scene.add(fill);

/* tunnel guide lines: two glowing rails on floor and ceiling */
function rail(y, color) {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-2.6, y, 10), new THREE.Vector3(-2.6, y, -90),
    new THREE.Vector3(2.6, y, 10),  new THREE.Vector3(2.6, y, -90),
  ]);
  const m = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity: .5 }));
  scene.add(m);
}
rail(-2.1, 0x8b3dff); rail(2.1, 0x8b3dff);

/* faint floor grid */
const grid = new THREE.GridHelper(120, 60, 0x2a1650, 0x170d30);
grid.position.y = -2.1;
scene.add(grid);

/* panels: video planes with glass overlay + glow frame, alternating sides */
const PANEL_SPACING = 7;
const panels = [];
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xb07cff, transparent: true, opacity: 0.07,
  roughness: 0.35, metalness: 0.1, side: THREE.DoubleSide,
  envMapIntensity: 0.2, specularIntensity: 0.3,
});
const frameMat = new THREE.MeshBasicMaterial({ color: 0x8b3dff, transparent: true, opacity: .8, wireframe: true });

for (let i = 0; i < 12; i++) {
  const side = i % 2 === 0 ? -1 : 1;
  const z = -6 - i * PANEL_SPACING;
  const group = new THREE.Group();

  const v = document.createElement('video');
  v.src = VIDEOS[i % VIDEOS.length];
  v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
  v.play().catch(() => {});
  const tex = new THREE.VideoTexture(v);
  tex.colorSpace = THREE.SRGBColorSpace;
  const screen = new THREE.Mesh(
    new THREE.PlaneGeometry(3.4, 2.55),
    new THREE.MeshBasicMaterial({ map: tex })
  );

  const glass = new THREE.Mesh(new THREE.PlaneGeometry(3.42, 2.57), glassMat);
  glass.position.z = 0.03;

  const frame = new THREE.Mesh(new THREE.PlaneGeometry(3.95, 3.05), frameMat);
  frame.position.z = -0.02;

  const halo = new THREE.Mesh(
    new THREE.PlaneGeometry(4.7, 3.8),
    new THREE.MeshBasicMaterial({ color: 0x8b3dff, transparent: true, opacity: 0.10, blending: THREE.AdditiveBlending })
  );
  halo.position.z = -0.08;

  group.add(halo, frame, screen, glass);
  group.position.set(side * 2.9, 0, z);
  group.rotation.y = side * 0.42; /* angle inward toward the walkway */
  scene.add(group);
  panels.push({ group, video: v, baseZ: z, seed: Math.random() * Math.PI * 2 });
}

/* end wall: big VEX text on canvas texture */
function textPlane() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#06070F'; g.fillRect(0, 0, 1024, 512);
  g.font = '900 260px "Readex Pro", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.strokeStyle = '#8B3DFF'; g.lineWidth = 3;
  g.strokeText('VEX.', 512, 256);
  g.shadowColor = '#8B3DFF'; g.shadowBlur = 40;
  g.strokeText('VEX.', 512, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), new THREE.MeshBasicMaterial({ map: t, transparent: true }));
  m.position.set(0, 0, -95);
  scene.add(m);
}
document.fonts.ready.then(textPlane);

/* scroll driver */
const space = document.getElementById('scroll-space');
const caps = [document.getElementById('cap0'), document.getElementById('cap1'), document.getElementById('cap2')];
let targetZ = 8, camZ = 8;
const CAM_START = 8, CAM_END = -88;

function onScroll() {
  const max = space.offsetHeight - innerHeight;
  const p = Math.min(1, Math.max(0, scrollY / max));
  targetZ = CAM_START + (CAM_END - CAM_START) * p;
  /* captions */
  caps.forEach((c, i) => {
    const lo = i / 3, hi = (i + 1) / 3;
    const local = (p - lo) / (hi - lo);
    const o = local < 0 || local > 1 ? 0 : (local < .2 ? local / .2 : local > .8 ? (1 - local) / .2 : 1);
    c.style.opacity = o.toFixed(2);
  });
}
addEventListener('scroll', onScroll, { passive: true });
onScroll();

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
resize();

/* subtle pointer parallax */
let mx = 0, my = 0;
addEventListener('pointermove', e => {
  mx = (e.clientX / innerWidth - 0.5);
  my = (e.clientY / innerHeight - 0.5);
});

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  camZ += (targetZ - camZ) * 0.07; /* smooth follow */
  camera.position.z = camZ;
  camera.position.x += ((mx * 0.8) - camera.position.x) * 0.05;
  camera.position.y += ((-my * 0.5) - camera.position.y) * 0.05;
  camera.lookAt(0, 0, camZ - 8);
  key.position.z = camZ - 6;
  panels.forEach(p => {
    p.group.position.y = Math.sin(t * 0.7 + p.seed) * 0.12;
  });
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
