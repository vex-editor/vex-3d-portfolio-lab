<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX — أهلاً بيك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root { --purple:#8B3DFF; --purple-bright:#A66BFF; --fg:#F4F2FF; --muted:#9A94B8; --border:rgba(139,61,255,.18); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:#06070F; color:var(--fg); font-family:'Readex Pro',sans-serif; overflow:hidden; }

  header.lab-nav {
    position:fixed; inset-inline:0; top:0; z-index:50; display:flex; align-items:center;
    justify-content:space-between; padding:16px 28px;
    background:linear-gradient(180deg, rgba(6,7,15,.85), transparent);
  }
  .logo { font-weight:900; font-size:1.3rem; color:var(--fg); text-decoration:none; }
  .logo span { color:var(--purple-bright); }
  .back-link {
    color:var(--muted); text-decoration:none; font-size:.85rem; border:1px solid var(--border);
    padding:7px 14px; border-radius:999px; transition:.2s;
  }
  .back-link:hover { color:var(--fg); border-color:var(--purple); background:rgba(139,61,255,.12); }

  /* Intro: full-viewport video, edge to edge, never cropped */
  #intro { position:relative; height:100vh; height:100svh; display:grid; place-items:center; }
  #videoWrapA {
    position:relative; width:100vw; aspect-ratio:16/9; overflow:hidden; background:#06070F;
  }
  #videoWrapA video { width:100%; height:100%; object-fit:contain; display:block; }
  #videoWrapA:fullscreen { width:100%; height:100%; aspect-ratio:auto; background:#000; }
  #titleA {
    position:absolute; top:8vh; inset-inline:0; text-align:center; z-index:3;
    font-weight:900; font-size:clamp(2rem,7vw,5.5rem); line-height:1.1; pointer-events:none;
    text-shadow:0 4px 30px rgba(6,7,15,.85), 0 1px 8px rgba(6,7,15,.6);
  }

  /* Enter gate: shown only when unmuted autoplay is blocked */
  #enterGate {
    position:fixed; inset:0; z-index:40; display:none; place-items:center; cursor:pointer;
    background:radial-gradient(120% 120% at 50% 40%, #14093A 0%, #06070F 60%);
  }
  #enterGate.show { display:grid; }
  .gate-inner { text-align:center; animation:gatePulse 2.2s ease-in-out infinite; }
  .gate-logo { font-weight:900; font-size:clamp(3rem,10vw,6rem); letter-spacing:.06em; }
  .gate-logo span { color:var(--purple-bright); }
  .gate-hint { margin-top:14px; color:var(--muted); font-size:clamp(.85rem,2vw,1rem); }
  @keyframes gatePulse { 0%,100% { opacity:.75; transform:scale(1); } 50% { opacity:1; transform:scale(1.03); } }

  /* Fade to site when the intro ends */
  #fadeOut {
    position:fixed; inset:0; z-index:60; background:#06070F; opacity:0;
    pointer-events:none; transition:opacity .8s ease;
  }
  #fadeOut.show { opacity:1; }
</style>
</head>
<body>

<!-- INTRO MODULE for the main VEX site (prepared in the lab, pending "نزل").
     Drop this file + intro-sceneA.mp4 + posters/intro-sceneA.jpg into the site
     and link/redirect to it. Video ends -> fades straight into ./ (the site). -->
<header class="lab-nav">
  <a class="logo" href="./">VEX<span>.</span></a>
  <div class="nav-links">
    <a class="back-link" href="./">تخطي ودخول الموقع ←</a>
  </div>
</header>

<div id="intro">
  <h1 id="titleA">الشغل اللي بيتشاف</h1>
  <div id="videoWrapA">
    <video id="videoA" src="intro-sceneA.mp4" poster="posters/intro-sceneA.jpg" preload="auto" muted playsinline autoplay></video>
  </div>
</div>

<div id="enterGate" role="button" aria-label="اضغط للدخول">
  <div class="gate-inner">
    <div class="gate-logo">VEX<span>.</span></div>
    <div class="gate-hint">اضغط في أي مكان عشان تبدأ</div>
  </div>
</div>
<div id="fadeOut"></div>

<script>
const videoA = document.getElementById("videoA");
const videoWrapA = document.getElementById("videoWrapA");
const enterGate = document.getElementById("enterGate"), fadeOut = document.getElementById("fadeOut");

// Sound without a button: try unmuted autoplay (works with high Media Engagement),
// otherwise hold on a cinematic enter gate; the first tap starts the intro with sound.
let introStarted = false;
async function beginIntro(withSound) {
  introStarted = true;
  enterGate.classList.remove("show");
  const portraitPhone = matchMedia("(max-width: 767px) and (orientation: portrait)").matches;
  if (portraitPhone) {
    try {
      if (videoWrapA.requestFullscreen) {
        await videoWrapA.requestFullscreen();
        try { await screen.orientation.lock("landscape"); } catch (e) {}
      } else if (videoA.webkitEnterFullscreen) {
        videoA.webkitEnterFullscreen(); // iOS: native fullscreen player, uncropped
      }
    } catch (e) {}
  }
  videoA.muted = !withSound;
  videoA.currentTime = 0;
  videoA.play().catch(() => { videoA.muted = true; videoA.play().catch(() => {}); });
}
(async () => {
  try {
    videoA.muted = false;
    await videoA.play();
    introStarted = true; // unmuted autoplay allowed (returning/high-engagement visitor)
  } catch (e) {
    videoA.muted = true;
    videoA.pause();
    enterGate.classList.add("show");
    enterGate.addEventListener("pointerdown", () => beginIntro(true), { once: true });
  }
})();

// When the intro ends, fade out and bring up the site - no extra click, nothing in between.
videoA.addEventListener("ended", () => {
  try { screen.orientation.unlock(); } catch (e) {}
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); }
  fadeOut.classList.add("show");
  setTimeout(() => { location.assign("./"); }, 850);
});
</script>
</body>
</html>
