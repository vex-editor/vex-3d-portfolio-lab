<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX Lab — تجربة التفاعل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06070F; --bg2: #0B0D1A; --purple: #8B3DFF; --purple-bright: #A66BFF;
    --fg: #F4F2FF; --muted: #9A94B8; --border: rgba(139,61,255,.18);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--fg); font-family:'Readex Pro',sans-serif; overflow-x:hidden; }

  header.lab-nav {
    position:fixed; inset-inline:0; top:0; z-index:50; display:flex; align-items:center;
    justify-content:space-between; padding:16px 28px;
    background:linear-gradient(180deg, rgba(6,7,15,.85), transparent);
  }
  .logo { font-weight:900; font-size:1.3rem; letter-spacing:.5px; color:var(--fg); text-decoration:none; }
  .logo span { color:var(--purple-bright); }
  .back-link {
    color:var(--muted); text-decoration:none; font-size:.85rem; border:1px solid var(--border);
    padding:7px 14px; border-radius:999px; transition:.2s;
  }
  .back-link:hover { color:var(--fg); border-color:var(--purple); background:rgba(139,61,255,.12); }

  /* ===== Section 1: particle dissolve hero ===== */
  .phero { position:relative; height:100vh; height:100svh; overflow:hidden; }
  #pcanvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .phero .giant {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:1;
  }
  .phero .giant span {
    font-weight:900; font-size:clamp(6rem, 22vw, 20rem); line-height:1;
    color:transparent; -webkit-text-stroke:1.5px rgba(139,61,255,.22);
    letter-spacing:.02em; user-select:none;
  }
  #pcanvas { z-index:2; }
  .hint {
    position:absolute; bottom:34px; inset-inline:0; display:flex; justify-content:center; z-index:3; pointer-events:none;
  }
  .hint span {
    font-size:.8rem; color:var(--muted); border:1px solid var(--border); border-radius:999px;
    padding:8px 18px; background:rgba(6,7,15,.6); backdrop-filter:blur(8px);
  }
  .hint b { color:var(--purple-bright); font-weight:600; }

  /* ===== Section 2: interactive services list (mondragon style) ===== */
  .services { padding:14vh 6vw 10vh; position:relative; }
  .services h2 { font-size:clamp(.85rem,1.4vw,1rem); color:var(--muted); font-weight:400; margin-bottom:5vh; letter-spacing:.05em; }
  .svc-row {
    display:flex; align-items:baseline; gap:3vw; padding:3.2vh 0; border-top:1px solid var(--border);
    text-decoration:none; color:var(--fg); position:relative; cursor:pointer;
  }
  .svc-row:last-child { border-bottom:1px solid var(--border); }
  .svc-idx { font-size:.8rem; color:var(--muted); min-width:2.2em; font-weight:300; }
  .svc-word {
    font-size:clamp(1.7rem, 5.2vw, 4.2rem); font-weight:700; line-height:1.15;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), color .35s;
  }
  .svc-en {
    margin-inline-start:auto; font-size:.75rem; color:var(--muted); font-weight:300;
    letter-spacing:.12em; text-transform:uppercase; transition:color .3s;
  }
  .svc-row:hover .svc-word { transform:translateX(-14px); color:var(--purple-bright); }
  .svc-row:hover .svc-en { color:var(--fg); }
  #floatPreview {
    position:fixed; z-index:40; width:min(300px, 34vw); aspect-ratio:4/3; border-radius:14px;
    overflow:hidden; pointer-events:none; opacity:0; transform:scale(.85) rotate(-4deg);
    transition:opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1);
    border:1px solid var(--border); box-shadow:0 24px 70px rgba(139,61,255,.35);
  }
  #floatPreview.on { opacity:1; transform:scale(1) rotate(-4deg); }
  #floatPreview img { width:100%; height:100%; object-fit:cover; display:block; }

  /* ===== Section 3: 3D tilted marquee ===== */
  .ribbon { padding:10vh 0 14vh; overflow:hidden; position:relative; }
  .ribbon h2 { text-align:center; font-size:.85rem; color:var(--muted); font-weight:400; margin-bottom:7vh; letter-spacing:.05em; }
  .tilt-scene { perspective:1100px; direction:ltr; }
  .tilt-row { display:flex; gap:22px; width:max-content; transform:rotateX(14deg) rotateZ(-4deg); margin-bottom:26px; will-change:transform; }
  .mtrack { display:flex; gap:22px; animation:slide 36s linear infinite; }
  .tilt-row.rev .mtrack { animation-direction:reverse; }
  .tilt-row:hover .mtrack { animation-play-state:paused; }
  @keyframes slide { to { transform:translateX(calc(-50% - 11px)); } }
  .mcard {
    width:230px; aspect-ratio:4/3; border-radius:16px; overflow:hidden; flex:0 0 auto;
    border:1px solid var(--border); box-shadow:0 18px 50px rgba(0,0,0,.5), 0 0 0 rgba(139,61,255,0);
    transition:box-shadow .3s, transform .3s;
  }
  .mcard:hover { transform:translateY(-8px) scale(1.03); box-shadow:0 26px 60px rgba(139,61,255,.4); }
  .mcard img { width:100%; height:100%; object-fit:cover; display:block; }

  footer { padding:6vh 6vw; border-top:1px solid var(--border); display:flex; justify-content:space-between; color:var(--muted); font-size:.78rem; }
  footer b { color:var(--purple-bright); font-weight:600; }

  @media (max-width:768px) {
    .svc-en { display:none; }
    #floatPreview { width:52vw; }
    .mcard { width:170px; }
  }
</style>
</head>
<body>

<header class="lab-nav">
  <a class="logo" href="./">VEX<span>.</span></a>
  <a class="back-link" href="scenes.html">مشاهد 3D</a>
  <a class="back-link" href="tunnel.html">النفق</a>
  <a class="back-link" href="./">الموقع الرئيسي ←</a>
</header>

<!-- 1 — particle dissolve hero -->
<section class="phero" id="phero">
  <div class="giant"><span>VEX</span></div>
  <canvas id="pcanvas"></canvas>
  <div class="hint"><span>حرّك الماوس على الشخصية — <b>الجزيئات بتتفاعل معاك</b></span></div>
</section>

<!-- 2 — interactive services list -->
<section class="services" id="services">
  <h2>اللي بنقدمه — hover على أي خدمة</h2>
  <div id="svcList"></div>
</section>
<div id="floatPreview"><img alt=""></div>

<!-- 3 — 3D tilted marquee -->
<section class="ribbon">
  <h2>من الشغل — عدّي الماوس يوقف</h2>
  <div class="tilt-scene">
    <div class="tilt-row" id="row1"></div>
    <div class="tilt-row rev" id="row2"></div>
  </div>
</section>

<footer>
  <span>نسخة تجريبية — <b>VEX Lab</b></span>
  <span>التأثيرات من ريل المرجع، بألوان VEX</span>
</footer>

<script>
"use strict";
const isMobile = innerWidth < 768 || /Mobi|Android/i.test(navigator.userAgent);
const params = new URLSearchParams(location.search);
const RECORD = params.has("record");

/* ============ 1) PARTICLE DISSOLVE ============ */
const canvas = document.getElementById("pcanvas");
const ctx = canvas.getContext("2d");
let particles = [], W = 0, H = 0, DPR = 1;
const mouse = { x: -9999, y: -9999, active: false };
const REP_R = isMobile ? 110 : 150;      // repulsion radius (css px)
const REP_F = isMobile ? 14 : 20;        // repulsion force
const SPRING = 0.028, DAMP = 0.875;

function buildParticles(img) {
  const off = document.createElement("canvas");
  const iw = img.naturalWidth, ih = img.naturalHeight;
  off.width = iw; off.height = ih;
  const octx = off.getContext("2d", { willReadFrequently: true });
  octx.drawImage(img, 0, 0);
  const data = octx.getImageData(0, 0, iw, ih).data;

  const hero = document.getElementById("phero");
  W = hero.clientWidth; H = hero.clientHeight;
  DPR = RECORD ? 1 : Math.min(devicePixelRatio || 1, 2);
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const targetH = Math.min(H * 0.74, 660);
  const scale = targetH / ih;
  const dispW = iw * scale;
  const ox = (W - dispW) / 2, oy = (H - targetH) / 2 - H * 0.02;
  const step = isMobile ? 5 : 4;         // sample grid in image px
  const dot = Math.max(1.1, step * scale * 0.62);

  particles = [];
  for (let y = 0; y < ih; y += step) {
    for (let x = 0; x < iw; x += step) {
      const a = data[(y * iw + x) * 4 + 3];
      if (a < 120) continue;
      const i = (y * iw + x) * 4;
      const hx = ox + x * scale, hy = oy + y * scale;
      particles.push({
        hx, hy, x: hx, y: hy, vx: 0, vy: 0,
        c: `rgb(${Math.min(255, data[i] * 1.9 + 26) | 0},${Math.min(255, data[i+1] * 1.9 + 22) | 0},${Math.min(255, data[i+2] * 1.9 + 34) | 0})`,
        s: dot * (0.8 + Math.random() * 0.4),
        seed: Math.random() * Math.PI * 2
      });
    }
  }
}

function frame(tms) {
  const t = tms / 1000;
  ctx.clearRect(0, 0, W, H);
  // cursor glow
  if (mouse.active && !RECORD) {
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, REP_R * 1.6);
    g.addColorStop(0, "rgba(139,61,255,.14)");
    g.addColorStop(1, "rgba(139,61,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(mouse.x - REP_R * 1.6, mouse.y - REP_R * 1.6, REP_R * 3.2, REP_R * 3.2);
  }
  const R2 = REP_R * REP_R;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const dx = p.x - mouse.x, dy = p.y - mouse.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < R2 && d2 > 0.01) {
      const d = Math.sqrt(d2);
      const f = (1 - d / REP_R) ** 2 * REP_F;
      p.vx += (dx / d) * f; p.vy += (dy / d) * f;
    }
    p.vx += (p.hx - p.x) * SPRING; p.vy += (p.hy - p.y) * SPRING;
    p.vx *= DAMP; p.vy *= DAMP;
    p.x += p.vx; p.y += p.vy;
    // idle shimmer (subtle drift when calm)
    const spd = Math.abs(p.vx) + Math.abs(p.vy);
    const wob = spd < 0.6 ? Math.sin(t * 1.6 + p.seed) * 0.35 : 0;
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x, p.y + wob, p.s, p.s);
  }
  requestAnimationFrame(frame);
}

function setMouse(cx, cy) {
  const r = canvas.getBoundingClientRect();
  mouse.x = cx - r.left; mouse.y = cy - r.top; mouse.active = true;
}
addEventListener("pointermove", e => setMouse(e.clientX, e.clientY), { passive: true });
addEventListener("pointerleave", () => { mouse.active = false; mouse.x = mouse.y = -9999; });
addEventListener("touchmove", e => { const t = e.touches[0]; setMouse(t.clientX, t.clientY); }, { passive: true });
addEventListener("touchend", () => { mouse.active = false; mouse.x = mouse.y = -9999; });

const img = new Image();
img.src = "mummy-drawn.webp";
img.onload = () => { buildParticles(img); requestAnimationFrame(frame); if (RECORD) startRecording(); };
let rsz; addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => buildParticles(img), 180); });

/* ============ record mode (?record) — synthetic cursor + MediaRecorder ============ */
function startRecording() {
  const stream = canvas.captureStream(60);
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_000_000 });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: "video/webm" });
    const fr = new FileReader();
    fr.onload = () => { window.__rec = fr.result; window.__recDone = true; };
    fr.readAsDataURL(blob);
  };
  // synthetic cursor: sweeps + circles through the figure
  const t0 = performance.now(), DUR = 6500;
  function drive(now) {
    const p = Math.min(1, (now - t0) / DUR);
    const a = p * Math.PI * 4.2;                       // ~2 loops
    const rad = Math.min(W, H) * (0.16 + 0.22 * Math.sin(p * Math.PI * 3));
    mouse.x = W / 2 + Math.cos(a) * rad;
    mouse.y = H / 2 + Math.sin(a * 1.3) * rad * 0.8;
    mouse.active = true;
    if (p < 1) requestAnimationFrame(drive);
    else { mouse.active = false; setTimeout(() => rec.stop(), 400); }
  }
  setTimeout(() => { rec.start(); requestAnimationFrame(drive); }, 1200);
}

/* ============ 2) SERVICES LIST + cursor-follow preview ============ */
const SVCS = [
  { ar: "مونتاج ريلز",  en: "Reels Editing",   img: "1-vxw1.jpg" },
  { ar: "موشن جرافيك",  en: "Motion Graphics", img: "2-vxw2.jpg" },
  { ar: "تصحيح ألوان",  en: "Color Grading",   img: "2-vxw5.jpg" },
  { ar: "ساوند ديزاين", en: "Sound Design",    img: "2-vxw6.jpg" },
  { ar: "قبل وبعد",     en: "Before / After",  img: "3-vxw3.jpg" },
  { ar: "إعلانات براندات", en: "Brand Ads",    img: "4-vxw4.jpg" },
];
const svcList = document.getElementById("svcList");
const preview = document.getElementById("floatPreview");
const previewImg = preview.querySelector("img");
SVCS.forEach((s, i) => {
  const a = document.createElement("a");
  a.className = "svc-row"; a.href = "./#works";
  a.innerHTML = `<span class="svc-idx">0${i + 1}</span><span class="svc-word">${s.ar}</span><span class="svc-en">${s.en}</span>`;
  a.addEventListener("pointerenter", e => {
    if (e.pointerType !== "mouse") return;
    previewImg.src = s.img; preview.classList.add("on");
  });
  a.addEventListener("pointerleave", () => preview.classList.remove("on"));
  svcList.appendChild(a);
});
let px = 0, py = 0, tx = 0, ty = 0;
addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; }, { passive: true });
(function floatLoop() {
  px += (tx - px) * 0.12; py += (ty - py) * 0.12;
  preview.style.left = (px + 26) + "px";
  preview.style.top = (py - 90) + "px";
  requestAnimationFrame(floatLoop);
})();

/* ============ 3) 3D TILTED MARQUEE — video cards, hover = stop + play WITH sound ============ */
const ROW1 = ["1-vxw5.mp4","5-vxw1.mp4","6-vxw2.mp4","7-vxw3.mp4"];
const ROW2 = ["1-vex-motion.mp4","1-coffee-before-after.mp4","1-vex-stand-out.mp4","8-vxw4.mp4"];
let userActivated = false;
addEventListener("pointerdown", () => { userActivated = true; }, { once: true, capture: true });
function fillRow(id, vids) {
  const row = document.getElementById(id);
  const track = document.createElement("div");
  track.className = "mtrack";
  [...vids, ...vids].forEach(src => {
    const d = document.createElement("div");
    d.className = "mcard";
    d.innerHTML = `<video src="${src}" poster="posters/${src.replace('.mp4','.jpg')}" muted loop playsinline preload="auto"></video>`;
    const v = d.querySelector("video");
    d.addEventListener("pointerenter", e => {
      if (e.pointerType !== "mouse") return;
      v.play().then(() => {
        if (userActivated) { v.muted = false; v.volume = 1; }
      }).catch(() => {});
    });
    d.addEventListener("pointerleave", () => { v.pause(); v.muted = true; });
    d.addEventListener("click", () => { userActivated = true; if (!v.paused) { v.muted = false; v.volume = 1; } });
    track.appendChild(d);
  });
  row.appendChild(track);
}
fillRow("row1", ROW1);
fillRow("row2", ROW2);
</script>
</body>
</html>
