<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VEX — 3D Room Intro (preview)</title>
<style>
html,body{margin:0;height:100%;background:#03040a;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#1a1040,#03040a 70%);z-index:5;transition:opacity .8s}
#gate h1{font-size:64px;letter-spacing:10px;margin:0;background:linear-gradient(90deg,#9b7bff,#fff);-webkit-background-clip:text;color:transparent}
#gate button{padding:18px 40px;font-size:20px;border:0;border-radius:40px;background:#7C5CFF;color:#fff;box-shadow:0 0 40px #7C5CFF88}
#hud{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:14px;opacity:0;transition:opacity 1s;z-index:4;pointer-events:none;color:#cbb8ff}
#snd{position:fixed;top:14px;left:14px;z-index:6;padding:10px 14px;border:0;border-radius:20px;background:#ffffff22;color:#fff;font-size:15px;display:none}
</style></head><body>
<div id="gate"><h1>VEX</h1><div style="opacity:.7">معاينة انترو 3D</div><button id="go">▶ ادخل الغرفة</button></div>
<button id="snd">🔊 اكتم</button><div id="hud">اسحب بصبعك للتحريك · دوس على أي شاشة</div>
<script type="module">
import * as THREE from './1-three160.module.js';
const SHOW = '5-intro-sceneA.mp4';
const WORKS = ['1-vxw5.mp4','8-vxw4.mp4','6-vxw2.mp4','1-coffee-before-after.mp4'];
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03040a);
scene.fog = new THREE.FogExp2(0x03040a,0.055);
const cam = new THREE.PerspectiveCamera(innerWidth<innerHeight?78:60,innerWidth/innerHeight,0.1,100);
// floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x07081a,roughness:.25,metalness:.8}));
floor.rotation.x=-Math.PI/2; scene.add(floor);
const grid = new THREE.GridHelper(60,60,0x4a2fd0,0x1a1450); grid.position.y=0.01; grid.material.transparent=true; grid.material.opacity=.35; scene.add(grid);
scene.add(new THREE.AmbientLight(0x6655aa,.5));
const key = new THREE.PointLight(0x8f6bff,40,25); key.position.set(0,3.5,-1); scene.add(key);
// video helper
function mkVideo(src,{sound=false}={}){
  const v=document.createElement('video'); v.src=src; v.loop=!sound; v.muted=!sound; v.playsInline=true; v.setAttribute('playsinline',''); v.crossOrigin='anonymous'; v.preload='auto';
  const t=new THREE.VideoTexture(v); t.colorSpace=THREE.SRGBColorSpace; return {v,t};
}
function screen(tex,w,h){
  const g=new THREE.Group();
  const frame=new THREE.Mesh(new THREE.BoxGeometry(w+.12,h+.12,.06),new THREE.MeshStandardMaterial({color:0x0b0b1e,metalness:.9,roughness:.3,emissive:0x2a1a80,emissiveIntensity:.6}));
  const face=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,toneMapped:false}));
  face.position.z=.035; g.add(frame,face);
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(w*1.5,h*1.5),new THREE.MeshBasicMaterial({color:0x7C5CFF,transparent:true,opacity:.10,depthWrite:false}));
  
  return {g,face};
}
const show = mkVideo(SHOW,{sound:true});
const main = screen(show.t,8,4.5); main.g.position.set(0,4.3,-9.5); scene.add(main.g);
const pickable=[main.face]; main.face.userData.v=show.v;
const works=[]; 
WORKS.forEach((src,i)=>{
  const m=mkVideo(src); const s=screen(m.t,1.35,2.4); // portrait 9:16
  const a=(i-(WORKS.length-1)/2); 
  s.g.position.set(a*2.4,1.3,-3.4-Math.abs(a)*0.7);
  s.g.rotation.y=-a*0.28; s.g.userData.base=s.g.position.y; s.g.userData.ph=i*1.3;
  scene.add(s.g); works.push({...m,g:s.g}); pickable.push(s.face); s.face.userData.v=m.v;
});
// glowing VEX sign
{const c=document.createElement('canvas');c.width=1024;c.height=256;const x=c.getContext('2d');x.font='900 200px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#8f6bff';x.shadowBlur=60;x.fillStyle='#e9e0ff';x.fillText('VEX.',512,128);x.fillText('VEX.',512,128);
const tx=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(5,1.25),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false}));m.position.set(0,7.3,-9.6);scene.add(m);}
const pool=new THREE.Mesh(new THREE.CircleGeometry(6,64),new THREE.MeshBasicMaterial({color:0x5a3bd0,transparent:true,opacity:.18,depthWrite:false}));pool.rotation.x=-Math.PI/2;pool.position.set(0,.015,-5);scene.add(pool);
// dust particles
const N=500,pos=new Float32Array(N*3);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*20;pos[i*3+1]=Math.random()*7;pos[i*3+2]=(Math.random()-.5)*20-3;}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xb9a5ff,size:.035,transparent:true,opacity:.6}));scene.add(dust);
// VEX letters floor glow ring
const ring=new THREE.Mesh(new THREE.RingGeometry(2.2,2.26,96),new THREE.MeshBasicMaterial({color:0x9b7bff,side:THREE.DoubleSide,transparent:true,opacity:.7}));ring.rotation.x=-Math.PI/2;ring.position.set(0,.02,-1.5);scene.add(ring);
// camera path
let t0=null,started=false,yaw=0,pitch=0,ty=0,tp=0;
const start=new THREE.Vector3(0,1.6,7),end=new THREE.Vector3(0,2.0,2.2);
cam.position.copy(start); cam.lookAt(0,3.2,-7);
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
addEventListener('pointermove',e=>{if(!e.buttons&&e.pointerType==='mouse'){ty=(e.clientX/innerWidth-.5)*-.5;tp=(e.clientY/innerHeight-.5)*-.2;}});
let drag=null;
addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ty,tp,moved:false};});
addEventListener('pointermove',e=>{if(drag&&e.buttons){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;ty=Math.max(-.7,Math.min(.7,drag.ty+dx*.003));tp=Math.max(-.3,Math.min(.3,drag.tp+dy*.002));}});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
addEventListener('pointerup',e=>{if(!started||!drag||drag.moved){drag=null;return;}drag=null;
  mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
  const h=ray.intersectObjects(pickable)[0]; if(h) focus(h.object.parent);});
let focusG=null,focusT=0;
function focus(g){focusG=(focusG===g)?null:g;focusT=0;}
const clock=new THREE.Clock();
function frame(){
  const dt=clock.getDelta(),t=clock.elapsedTime;
  if(started){
    if(t0===null)t0=t; const k=Math.min(1,(t-t0)/7); const e=ease(k);
    const tgt=new THREE.Vector3().lerpVectors(start,end,e);
    if(focusG){focusT=Math.min(1,focusT+dt*1.5);const wp=new THREE.Vector3();focusG.getWorldPosition(wp);tgt.lerp(new THREE.Vector3(wp.x,wp.y,wp.z+(focusG===main.g?4.2:2.2)),ease(focusT));}
    cam.position.lerp(tgt,.12);
    yaw+=(ty-yaw)*.06;pitch+=(tp-pitch)*.06;
    cam.rotation.set(0.2*ease(Math.min(1,(t-t0)/7)),0,0);cam.rotateY(yaw);cam.rotateX(pitch);
    document.getElementById('hud').style.opacity=k>.8?1:0;
  } else { cam.position.x=Math.sin(t*.2)*.4; cam.lookAt(0,3.2,-7); }
  works.forEach(w=>{w.g.position.y=w.g.userData.base+Math.sin(t*.8+w.g.userData.ph)*.12;});
  dust.rotation.y=t*.01; key.intensity=38+Math.sin(t*2)*4;
  renderer.render(scene,cam); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?78:60;cam.updateProjectionMatrix();});
// start: play() synchronously inside tap
const snd=document.getElementById('snd');
document.getElementById('go').addEventListener('click',()=>{
  show.v.muted=false; show.v.volume=1; const p=show.v.play(); if(p)p.catch(()=>{show.v.muted=true;show.v.play();snd.textContent='🔊 شغّل الصوت';});
  works.forEach(w=>w.v.play().catch(()=>{}));
  started=true; document.getElementById('gate').style.opacity=0; setTimeout(()=>document.getElementById('gate').style.display='none',800);
  snd.style.display='block';
  const d=document.documentElement; if(d.requestFullscreen)d.requestFullscreen().catch(()=>{});
});
snd.addEventListener('click',()=>{show.v.muted=!show.v.muted;snd.textContent=show.v.muted?'🔊 شغّل الصوت':'🔇 اكتم';if(!show.v.muted)show.v.play();});
window.__room={cam,show:show.v};
</script></body></html>
